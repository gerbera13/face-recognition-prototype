<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBank — Распознавание лиц</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        .header { background: #1a2a3a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a4a6a; }
        .header h1 { font-size: 22px; color: #5dade2; }
        .badge { background: #27ae60; color: white; padding: 5px 12px; border-radius: 12px; font-size: 14px; }
        .badge.red { background: #e74c3c; }
        .container { display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .video-panel { flex: 2; position: relative; }
        video { width: 100%; border-radius: 12px; border: 3px solid #2a4a6a; background: #000; }
        canvas { display: none; }
        .overlay { position: absolute; top: 15px; left: 15px; padding: 8px 16px; border-radius: 8px; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .overlay.found { background: rgba(39, 174, 96, 0.85); }
        .overlay.not-found { background: rgba(231, 76, 60, 0.85); }
        .info-bar { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        .info-pill { background: #1a2a3a; padding: 6px 14px; border-radius: 8px; font-size: 13px; color: #aaa; }
        .info-pill span { color: #5dade2; font-weight: bold; }
        .controls { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #1a2a3a; border-radius: 12px; padding: 20px; border: 1px solid #2a4a6a; }
        .card h3 { font-size: 16px; margin-bottom: 12px; color: #5dade2; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #2a4a6a; background: #0f1923; color: #e0e0e0; font-size: 14px; }
        input:focus { outline: none; border-color: #5dade2; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-primary { background: #27ae60; color: white; }
        .btn-secondary { background: #5dade2; color: white; }
        .btn-warn { background: #e74c3c; color: white; }
        .btn-gray { background: #2a4a6a; color: #ccc; font-weight: normal; }
        #customerList { max-height: 250px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
        .status { margin-top: 8px; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
        .status.ok { background: rgba(39, 174, 96, 0.2); color: #2ecc71; }
        .status.err { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FaceBank — Распознавание лиц</h1>
        <div><span class="badge" id="dbCount">DB: {{ count }} клиентов</span></div>
    </div>

    <div class="container">
        <div class="video-panel">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay not-found" id="overlay">ЗАГРУЗКА...</div>
            <div class="info-bar">
                <div class="info-pill">Совпадение: <span id="conf">—</span>%</div>
                <div class="info-pill">Лицо: <span id="faceStatus">—</span></div>
            </div>
        </div>

        <div class="controls">
            <div class="card">
                <h3>Регистрация клиента</h3>
                <input type="text" id="enrollId" placeholder="ID клиента (напр. 001)">
                <input type="text" id="enrollName" placeholder="ФИО клиента">
                <button class="btn-primary" onclick="doEnroll()">Зарегистрировать лицо</button>
                <div id="enrollStatus"></div>
            </div>

            <div class="card">
                <h3>Клиенты в базе</h3>
                <button class="btn-gray" onclick="loadCustomers()">Обновить список</button>
                <div id="customerList"></div>
            </div>

            <div class="card" style="display: flex; gap: 8px; flex-direction: column;">
                <button class="btn-secondary" onclick="saveDB()">Сохранить базу</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
                video.srcObject = stream;
            } catch (e) {
                overlay.textContent = 'Нет доступа к камере';
                overlay.className = 'overlay not-found';
            }
        }

        function captureFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        async function identify() {
            const img = captureFrame();
            try {
                const resp = await fetch('/api/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: img })
                });
                const data = await resp.json();

                overlay.textContent = data.verdict;
                overlay.className = data.found ? 'overlay found' : 'overlay not-found';
                document.getElementById('conf').textContent = data.confidence;
                document.getElementById('faceStatus').textContent = data.face_detected ? 'Есть' : 'Нет';
                document.getElementById('faceStatus').style.color = data.face_detected ? '#2ecc71' : '#e74c3c';
            } catch (e) {
                console.error(e);
            }
        }

        async function doEnroll() {
            const id = document.getElementById('enrollId').value.trim();
            const name = document.getElementById('enrollName').value.trim();
            if (!id || !name) { showStatus('enrollStatus', 'Введите ID и ФИО', false); return; }

            const img = captureFrame();
            const resp = await fetch('/api/enroll', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: img, id, name })
            });
            const data = await resp.json();
            showStatus('enrollStatus', data.ok ? `Добавлен: ${data.name}` : data.error, data.ok);
            if (data.ok) updateCount();
        }

        async function loadCustomers() {
            const resp = await fetch('/api/customers');
            const data = await resp.json();
            const div = document.getElementById('customerList');
            div.innerHTML = data.list.length
                ? data.list.map(s => `<div>${s.replace(/^  /, '')}</div>`).join('')
                : '<div style="color:#666">База пуста</div>';
            updateCount();
        }

        async function saveDB() {
            await fetch('/api/save');
            showStatus('enrollStatus', 'База сохранена', true);
        }

        function showStatus(id, msg, ok) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'status ' + (ok ? 'ok' : 'err');
        }

        async function updateCount() {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            document.getElementById('dbCount').textContent = `DB: ${data.customers} клиентов`;
        }

        startCamera();
        loadCustomers();
        setInterval(identify, 600);
    </script>
</body>
</html>
